name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:demo

      - name: Accessibility
        working-directory: tools/a11y
        env:
          # The runner image ships Chrome; the scanner drives it rather than
          # downloading one of its own.
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm install --no-audit --no-fund
          node scan.js
