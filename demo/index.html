<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>flipview demo</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #eef2f7; color: #223; }
  header { display: flex; gap: 14px; align-items: center; padding: 10px 18px; background: #1976d2; color: #fff; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; font-weight: 700; }
  header .btn, header label.btn { background: rgba(255,255,255,.16); border: 0; color: #fff; font: inherit; border-radius: 6px; padding: 7px 13px; font-weight: 600; cursor: pointer; }
  header .btn:hover, header label.btn:hover { background: rgba(255,255,255,.28); }
  header label.opt { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
  #status { margin-left: auto; font-size: 13px; opacity: .9; }
  #stage { padding: 20px 16px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<header>
  <h1>flipview</h1>
  <label class="btn" for="file">Open a PDF</label>
  <input id="file" type="file" accept="application/pdf,image/*" multiple />
  <label class="opt"><input id="cover" type="checkbox" /> Cover mode</label>
  <label class="opt"><input id="hard" type="checkbox" /> Rigid covers</label>
  <button class="btn" id="light" type="button">Lightbox</button>
  <label class="opt"><input id="rtl" type="checkbox" /> Right to left</label>
  <label class="opt"><input id="sound" type="checkbox" /> Sound</label>
  <label class="opt"><input id="slow" type="checkbox" /> Slow flip</label>
  <span id="status">loading...</span>
</header>
<div id="stage"></div>
<script type="module" src="./demo.ts"></script>
</body>
</html>
